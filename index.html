<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Sunny 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 10px;
    }

    #counter {
      margin-bottom: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    .buttons {
      position: relative;
      width: 300px;
      height: 200px;
    }

    button {
      position: absolute;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #ff6b81;
      color: white;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #no {
      background-color: #ccc;
      color: black;
    }
  </style>
</head>
<body>

  <h1>Sunny 🌞💖</h1>
  <h2>¿Quieres ser mi San Valentín?</h2>
  <div id="counter">Intentos de decir que no: 0</div>

  <div class="buttons">
    <button id="yes">Sí 💘</button>
    <button id="no">No 😅</button>
  </div>

  <audio id="music" loop>
    <source src="https://files.catbox.moe/3c7m8e.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const counter = document.getElementById("counter");
    const music = document.getElementById("music");

    let noCount = 0;
    let yesScale = 1;

    noBtn.addEventListener("click", () => {
      noCount++;
      counter.textContent = "Intentos de decir que no: " + noCount;

      yesScale += 0.15;
      yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;

      const x = Math.random() * 240;
      const y = Math.random() * 140;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      music.play();
      document.body.innerHTML = `
        <h1>💖💖💖</h1>
        <h2>Sabía que dirías que sí, Sunny 😏</h2>
        <p>Feliz San Valentín 🌹</p>
      `;
    });
  </script>

</body>
</html>
